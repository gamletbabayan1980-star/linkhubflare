<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkHub Flare — кабинет</title><meta name="robots" content="noindex"><style>body{margin:0;background:#050b18;color:#e8f0ff;font:16px system-ui,sans-serif;padding:20px}main{max-width:860px;margin:0 auto}.card{background:#0d1a33;border:1px solid #1f3a6b;border-radius:14px;padding:14px;margin:10px 0}input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #1f3a6b;background:#050b18;color:#e8f0ff;width:100%;margin:4px 0}button{background:#1c7bff;border:0;color:#fff;width:auto;cursor:pointer}</style></head><body><main><h1>LinkHub Flare</h1><div id="v"></div></main><script>const $=s=>document.querySelector(s);async function api(p,o={}){const r=await fetch('/api'+p,{credentials:'include',headers:{'content-type':'application/json'},...o});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}async function main(){try{const me=await api('/me');if(me.admin)return renderAdmin();if(me.user)return renderUser(me);}catch{}renderLogin()}function renderLogin(){$('#v').innerHTML='<div class="card"><h2>Вход</h2><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Пароль"><button onclick="login()">Войти</button><p id="msg"></p></div><div class="card"><h2>Админ</h2><input id="ac" type="password" placeholder="ERINMAR"><button onclick="adminLogin()">Войти как админ</button></div>';window.login=async()=>{try{await api('/login',{method:'POST',body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});location.reload()}catch(e){$('#msg').textContent=e.message}};window.adminLogin=async()=>{try{await api('/admin/login',{method:'POST',body:JSON.stringify({code:$('#ac').value})});location.reload()}catch(e){alert(e.message)}}}function renderAdmin(){$('#v').innerHTML='<div class="card"><h2>Админ</h2><button onclick="logout()">Выйти</button></div><div class="card"><h2>Площадки</h2><div id="lst"></div></div><div class="card"><h2>Заказы</h2><div id="ord"></div></div><div class="card"><h2>Проверить ссылку</h2><input id="chk" placeholder="https://..."><button onclick="check()">Проверить</button><pre id="res"></pre></div><div class="card"><h2>Автопоиск</h2><input id="q" placeholder="запрос"><button onclick="disc()">Искать</button><div id="disc"></div></div>';window.logout=async()=>{await api('/logout',{method:'POST'});location.reload()};loadL();loadO();window.check=async()=>{const r=await api('/admin/check-link',{method:'POST',body:JSON.stringify({url:$('#chk').value})});$('#res').textContent=JSON.stringify(r,null,2)};window.disc=async()=>{const r=await api('/admin/discover',{method:'POST',body:JSON.stringify({query:$('#q').value})});$('#disc').innerHTML=(r.candidates||[]).map(c=>'<div>'+c.url+' trust='+c.trust+'</div>').join('')}}async function loadL(){const r=await api('/admin/listings');$('#lst').innerHTML=(r.listings||[]).map(l=>'<div>'+l.domain+' trust='+l.trust+' <button onclick="ap(\''+l.id+'\')">Одобрить</button></div>').join('');window.ap=async id=>{await api('/admin/listings/'+id+'/approve',{method:'POST'});loadL()}}async function loadO(){const r=await api('/admin/orders');$('#ord').innerHTML=(r.orders||[]).map(o=>'<div>'+o.targetUrl+' '+o.status+'</div>').join('')}function renderUser(u){$('#v').innerHTML='<div class="card"><h2>'+u.email+'</h2><button onclick="logout()">Выйти</button></div>';window.logout=async()=>{await api('/logout',{method:'POST'});location.reload()}}main();</script></body></html>
